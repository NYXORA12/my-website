<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Map</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .btn {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    iframe {
      margin-top: 20px;
      border: none;
    }
    .back-btn {
      margin-top: 20px;
      padding: 8px 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1 id="welcome">Welcome to Our College</h1>

  <div id="buttonContainer">
    <button class="btn" onclick="showInfo('CSE')">CSE</button>
    <button class="btn" onclick="showInfo('ECE')">ECE</button>
    <button class="btn" onclick="showInfo('EEE')">EEE</button>
    <button class="btn" onclick="showInfo('MECH')">MECH</button>
    <button class="btn" onclick="showInfo('CIVIL')">CIVIL</button>
    <button class="btn" onclick="showInfo('AI&DS')">AI&DS</button>
  </div>

  <div id="infoSection"></div>

  <script>
    const departmentInfo = {
      "CSE": { block: "A1 Block", map: "https://www.google.com/maps/d/embed?mid=1KNcSQvjoU3ffNzudIyqIf_7WhkQWsks&ehbc=2E312F" },
      "ECE": { block: "A3 Block", map: "https://www.google.com/maps/d/embed?mid=13lQFAKxh6hgutqLy20LRQK6G-WiA76A&ehbc=2E312F" },
      "EEE": { block: "A4 Block", map: "https://www.google.com/maps/d/embed?mid=1OWpMa-yX7qHotkPL3oj5o58CqnGR1NA&ehbc=2E312F" },
      "MECH": { block: "B1 Block", map: "https://www.google.com/maps/d/embed?mid=1kwwXz7YIIN2gBW3dERUDHyEC_arx0XI&ehbc=2E312F" },
      "CIVIL": { block: "Civil Block", map: "https://www.google.com/maps/d/embed?mid=1TP1NNf3CrprD1IRkkFVHiJyk6NUq5Hg&ehbc=2E312F" },
      "AI&DS": { block: "B3 Block", map: "https://www.google.com/maps/d/embed?mid=15tqsskF6NgyJav2yebPmDkE7nMs24L8&ehbc=2E312F" }
    };

    function showInfo(dept) {
      const info = departmentInfo[dept];
      const section = document.getElementById("infoSection");
      document.getElementById("welcome").style.display = "none";
      document.getElementById("buttonContainer").style.display = "none";

      section.innerHTML = `
        <h2>${dept}</h2>
        <p><strong>Block:</strong> ${info.block}</p>
        <iframe src="${info.map}" width="100%" height="480"></iframe>
        <br>
        <button class="back-btn" onclick="goHome()">Back to Home</button>
      `;
    }

    function goHome() {
      document.getElementById("infoSection").innerHTML = "";
      document.getElementById("welcome").style.display = "block";
      document.getElementById("buttonContainer").style.display = "block";
    }
  </script>
</body>
</html>
