<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Classroom Locator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #007BFF;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      overflow-y: auto;
    }

    .sidebar h2 {
      margin-top: 0;
    }

    .category {
      cursor: pointer;
      padding: 10px 0;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category i {
      transition: transform 0.3s ease;
    }

    .category.open i {
      transform: rotate(90deg);
    }

    .sub-list {
      list-style: none;
      padding-left: 15px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .sub-list.show {
      max-height: 1000px;
    }

    .sub-list li {
      padding: 6px 0;
      cursor: pointer;
      color: #ecf0f1;
    }

    .sub-list li:hover {
      text-decoration: underline;
    }

    .main {
      flex: 1;
      position: relative;
      background-image: url("https://www.agarum.com/photos/1/1/15/205/c/l/07ca789bc30ba134509f463b4b3b80c3.jpg");
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .center-box {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .center-box h1 {
      margin: 0 0 20px;
      font-size: 2.5rem;
    }

    .search-container {
      display: flex;
      margin-top: 10px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .search-container input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px 0 0 6px;
    }

    .search-container button {
      padding: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
    }

    .search-container button:hover {
      background-color: #0056b3;
    }

    @media (max-width: 768px) {
      .center-box h1 {
        font-size: 1.8rem;
      }

      .search-container {
        flex-direction: column;
      }

      .search-container input, .search-container button {
        border-radius: 6px;
        width: 100%;
        margin: 5px 0;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Departments</h2>

    <div class="category" onclick="toggleList('engList', this)">Engineering <i class="fas fa-angle-right"></i></div>
    <ul class="sub-list" id="engList">
      <li onclick="showInfo('CSE')">CSE</li>
      <li onclick="showInfo('FOOT TECH')">FOOT TECH</li>
      <li onclick="showInfo('CSBS')">CSBS</li>
      <li onclick="showInfo('MECH')">MECH</li>
      <li onclick="showInfo('SF')">SF</li>
      <li onclick="showInfo('IT')">IT</li>
      <li onclick="showInfo('M.TECH CSE')">M.TECH CSE</li>
      <li onclick="showInfo('EEE')">EEE</li>
      <li onclick="showInfo('AIDS')">AIDS</li>
      <li onclick="showInfo('PCT')">PCT</li>
      <li onclick="showInfo('BIO MEDICAL')">BIO MEDICAL</li>
      <li onclick="showInfo('ECE')">ECE</li>
      <li onclick="showInfo('AERO')">AERO</li>
      <li onclick="showInfo('AGRI')">AGRI</li>
      <li onclick="showInfo('CIVIL')">CIVIL</li>
    </ul>

    <div class="category" onclick="toggleList('polyList', this)">Polytechnic <i class="fas fa-angle-right"></i></div>
    <ul class="sub-list" id="polyList">
      <li onclick="showInfo('DME')">DME</li>
      <li onclick="showInfo('DECE')">DECE</li>
      <li onclick="showInfo('D.CIVIL')">D.CIVIL</li>
      <li onclick="showInfo('DEEE')">DEEE</li>
      <li onclick="showInfo('DCSE')">DCSE</li>
      <li onclick="showInfo('D.X-RAY')">D.X-RAY</li>
      <li onclick="showInfo('DMLT')">DMLT</li>
    </ul>
  </div>

  <!-- Main Area -->
  <div class="main">
    <div class="center-box">
      <h1>WELCOME TO EXCEL INSTITUTIONS</h1>
      <div class="search-container">
        <input type="text" placeholder="Search a Department...">
        <button>Search</button>
      </div>
    </div>
  </div>

  <script>
    function toggleList(id, el) {
      const list = document.getElementById(id);
      list.classList.toggle('show');
      el.classList.toggle('open');
    }

    function showInfo(dept) {
      alert("Info for " + dept + " will be shown here.");
    }
  </script>
</body>
</html>
