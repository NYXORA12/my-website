<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Excel Institutions Map</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1571260899304-425eee4c7efc') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: white;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.6);
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    select {
      padding: 10px;
      font-size: 18px;
      border-radius: 5px;
      border: none;
      width: 250px;
    }

    .info {
      margin-top: 30px;
      background-color: rgba(255, 255, 255, 0.9);
      color: #000;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 800px;
    }

    iframe {
      border: none;
      width: 100%;
      height: 480px;
      border-radius: 10px;
      margin-top: 10px;
    }

    button.back-btn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="overlay" id="homeSection">
    <h1>Welcome to Excel Institutions</h1>
    <select id="deptSelect" onchange="showInfo()">
      <option value="">-- Select Department --</option>
      <option value="CSE">CSE</option>
      <option value="FOOT TECH">FOOT TECH</option>
      <option value="CSBS">CSBS</option>
      <option value="MECH">MECH</option>
      <option value="SF">SF</option>
      <option value="IT">IT</option>
      <option value="M.TECH CSE">M.TECH CSE</option>
      <option value="EEE">EEE</option>
      <option value="AIDS">AIDS</option>
      <option value="PCT">PCT</option>
      <option value="BIO MEDICAL">BIO MEDICAL</option>
      <option value="ECE">ECE</option>
      <option value="AERO">AERO</option>
      <option value="AGRI">AGRI</option>
      <option value="CIVIL">CIVIL</option>
      <option value="DME">DME</option>
      <option value="DAE">DAE</option>
      <option value="D.CIVIL">D.CIVIL</option>
      <option value="DECE">DECE</option>
      <option value="DEEE">DEEE</option>
      <option value="DCSE">DCSE</option>
      <option value="D.X-RAY">D.X-RAY</option>
      <option value="DMLT">DMLT</option>
    </select>
  </div>

  <div class="info" id="infoSection" style="display: none;"></div>

  <script>
    const blockData = {
      "CSE": "A1 Block",
      "FOOT TECH": "A1 Block",
      "CSBS": "A1 Block",
      "MECH": "A3 Block",
      "SF": "A3 Block",
      "IT": "B1 Block",
      "M.TECH CSE": "B1 Block",
      "EEE": "B1 Block",
      "AIDS": "B1 Block",
      "PCT": "B1 Block",
      "BIO MEDICAL": "Main Block",
      "ECE": "Main Block",
      "AERO": "A4 Block",
      "AGRI": "Civil Block",
      "CIVIL": "Civil Block",
      "DME": "B3 Block",
      "DAE": "B3 Block",
      "D.CIVIL": "B3 Block",
      "DECE": "B3 Block",
      "DEEE": "B3 Block",
      "DCSE": "B3 Block",
      "D.X-RAY": "B3 Block",
      "DMLT": "B3 Block"
    };

    const blockMaps = {
      "A1 Block": "https://www.google.com/maps/d/embed?mid=1KNcSQvjoU3ffNzudIyqIf_7WhkQWsks&ehbc=2E312F",
      "A3 Block": "https://www.google.com/maps/d/embed?mid=13lQFAKxh6hgutqLy20LRQK6G-WiA76A&ehbc=2E312F",
      "B1 Block": "https://www.google.com/maps/d/embed?mid=1OWpMa-yX7qHotkPL3oj5o58CqnGR1NA&ehbc=2E312F",
      "Main Block": "https://www.google.com/maps/d/embed?mid=1kwwXz7YIIN2gBW3dERUDHyEC_arx0XI&ehbc=2E312F",
      "A4 Block": "https://www.google.com/maps/d/embed?mid=15tqsskF6NgyJav2yebPmDkE7nMs24L8&ehbc=2E312F",
      "Civil Block": "https://www.google.com/maps/d/embed?mid=1TP1NNf3CrprD1IRkkFVHiJyk6NUq5Hg&ehbc=2E312F",
      "B3 Block": "https://www.google.com/maps/d/embed?mid=13lQFAKxh6hgutqLy20LRQK6G-WiA76A&ehbc=2E312F"
    };

    function showInfo() {
      const dept = document.getElementById("deptSelect").value;
      if (!dept) return;

      const block = blockData[dept];
      const mapURL = blockMaps[block] || '';

      document.getElementById("homeSection").style.display = "none";

      const info = `
        <h2>${dept}</h2>
        <p><strong>Located in:</strong> ${block}</p>
        ${mapURL ? `<iframe src="${mapURL}"></iframe>` : "<p>Map not available.</p>"}
        <button class="back-btn" onclick="goHome()">Back</button>
      `;

      const section = document.getElementById("infoSection");
      section.innerHTML = info;
      section.style.display = "block";
    }

    function goHome() {
      document.getElementById("infoSection").style.display = "none";
      document.getElementById("homeSection").style.display = "flex";
      document.getElementById("deptSelect").value = "";
    }
  </script>
</body>
</html>
