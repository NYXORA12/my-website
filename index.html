<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #2980b9; /* You can change this color */
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
    }

    .sidebar h2 {
      margin-top: 0;
    }

    .category {
      cursor: pointer;
      padding: 10px 0;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category i {
      transition: transform 0.3s ease;
    }

    .category.open i {
      transform: rotate(90deg);
    }

    .sub-list {
      list-style: none;
      padding-left: 15px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .sub-list.show {
      max-height: 500px;
    }

    .sub-list li {
      padding: 5px 0;
      cursor: pointer;
      color: #ecf0f1;
    }

    .sub-list li:hover {
      text-decoration: underline;
    }

    .main {
      flex: 1;
      padding: 20px;
      background-color: #ecf0f1;
      overflow-y: auto;
    }

    .welcome-image {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
    }

    .search-container {
      margin: 20px 0;
      display: flex;
      align-items: center;
      max-width: 400px;
    }

    .search-container input {
      width: 100%;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 4px 0 0 4px;
    }

    .search-container button {
      padding: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }

    .info-section {
      margin-top: 30px;
    }

    iframe {
      width: 100%;
      height: 300px;
      border: none;
      margin-top: 10px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .back-btn:hover {
      background-color: #1c5f91;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Departments</h2>

    <div class="category" onclick="toggleList('engList', this)">
      Engineering <i class="fas fa-angle-right"></i>
    </div>
    <ul class="sub-list" id="engList">
      <li onclick="showInfo('CSE')">CSE</li>
      <li onclick="showInfo('EEE')">EEE</li>
      <li onclick="showInfo('ECE')">ECE</li>
    </ul>

    <div class="category" onclick="toggleList('polyList', this)">
      Polytechnic <i class="fas fa-angle-right"></i>
    </div>
    <ul class="sub-list" id="polyList">
      <li>Mechanical</li>
      <li>EEE</li>
    </ul>
  </div>

  <div class="main">
    <h1>Welcome to Our College</h1>
    <img src="images/college-photo.jpg" alt="College Photo" class="welcome-image">

    <div class="search-container">
      <input type="text" placeholder="Search...">
      <button><i class="fas fa-search"></i></button>
    </div>

    <div class="info-section" id="infoSection">
      <!-- Dynamic department info will be inserted here -->
    </div>
  </div>

      list.classList.toggle('show');
      element.classList.toggle('open');
    }
